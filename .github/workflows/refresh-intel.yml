name: Refresh intel data

# Every 6 hours: download each feed in sources.yaml that is due by its own cadence
# (fast feeds daily, DB-IP monthly, borders twice a year), rebuild the snapshot and commit it.
# Raw downloads and their ETags persist between runs in the Actions cache, so unchanged
# feeds are skipped or answered with 304 Not Modified.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-download every feed, ignoring cadences"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-intel
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ".[snapshot]" pytest httpx
      - name: Restore the last raw downloads
        uses: actions/cache@v6
        with:
          path: data/intel
          key: intel-raw-${{ github.run_id }}
          restore-keys: intel-raw-
      - name: Download the feeds that are due
        run: PYTHONPATH=src python -m ittravel.intel.fetch --raw data/intel ${{ inputs.force && '--force' || '' }}
      - run: PYTHONPATH=src python -m ittravel.intel.snapshot --raw data/intel
      - name: Refresh the README numbers and source table
        run: PYTHONPATH=src python scripts/readme_numbers.py
      - run: ALIBI_OFFLINE=1 pytest -q tests/test_intel.py tests/test_fetch.py
      - name: Keep this snapshot version for 90 days
        uses: actions/upload-artifact@v7
        with:
          name: intel-snapshot-${{ github.run_id }}
          path: src/ittravel/intel_data
          retention-days: 90
      - name: Commit the new snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ittravel/intel_data README.md
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "Refresh intel data $(date -u +%F)" && git push; fi
