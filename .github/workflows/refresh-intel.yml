name: Refresh intel data

# Every 6 hours, and whenever main changes: download each feed in sources.yaml that is due
# (fast feeds daily, DB-IP monthly, borders twice a year), rebuild the snapshot, and publish
# main + the fresh snapshot as one commit on the `data` branch, which Vercel deploys.
# main itself only ever holds human commits; `data` is rebuilt from main on every run.
on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Re-download every feed, ignoring cadences"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-intel
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ".[snapshot]" pytest httpx
      - name: Restore the last raw downloads
        uses: actions/cache@v6
        with:
          path: data/intel
          key: intel-raw-${{ github.run_id }}
          restore-keys: intel-raw-
      - name: Download the feeds that are due
        run: PYTHONPATH=src python -m ittravel.intel.fetch --raw data/intel ${{ inputs.force && '--force' || '' }}
      - run: PYTHONPATH=src python -m ittravel.intel.snapshot --raw data/intel
      - name: Refresh the README numbers and source table
        run: PYTHONPATH=src python scripts/readme_numbers.py
      - run: ALIBI_OFFLINE=1 pytest -q tests/test_intel.py tests/test_fetch.py
      - name: Keep this snapshot version for 90 days
        uses: actions/upload-artifact@v7
        with:
          name: intel-snapshot-${{ github.run_id }}
          path: src/ittravel/intel_data
          retention-days: 90
      - name: Publish main + this snapshot to the data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B data
          git add src/ittravel/intel_data README.md
          git commit -q -m "Snapshot of $(date -u +%F' '%H:%M) UTC on top of main $(git rev-parse --short main)" || true
          git push -f origin data
