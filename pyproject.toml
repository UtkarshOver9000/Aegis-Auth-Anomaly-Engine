[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "alibi-security"
version = "4.0.0"
description = "Threat intelligence on real public data (breaches, malware servers, criminal networks, ransomware, exploited flaws) plus account-takeover scoring trained on the 31M-login RBA dataset"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn==1.9.1",
  "joblib>=1.3",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "pillow>=10.3",
]

[project.optional-dependencies]
train = ["duckdb>=1.1", "matplotlib>=3.8"]
snapshot = ["pycountry>=24.6", "shapely>=2.0", "pyyaml>=6.0"]
dev = ["duckdb>=1.1", "matplotlib>=3.8", "pyyaml>=6.0", "pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ittravel = ["artifacts/*", "dashboard/*", "dashboard/vendor/*", "dashboard/vendor/img/*", "dashboard/vendor/fonts/*", "intel_data/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
